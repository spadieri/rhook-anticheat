[package]
name = "rhook-anticheat"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
authors = ["spadieri"]
repository = "https://github.com/spadieri/rhook-anticheat"
description = "Defensive scanner: compares a running process against the clean on-disk image of its modules to surface injected DLLs, inline hooks and foreign threads. Built on rhook-common, pointed the opposite way."

[[bin]]
name = "rhook-anticheat"
path = "src/main.rs"

[dependencies]
rhook-common = { git = "https://github.com/spadieri/rhook.git", rev = "4a34389f840d5c221848a8c7a0bcf71794d50ea2" }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Console",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
